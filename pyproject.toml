[project]
name = "arrowjit"
version = "0.1.0"
description = "A JIT compiler that runs typed Python functions directly over Apache Arrow columns"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ikeh Chukwuka", email = "mrikehchukwuka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "llvmlite>=0.50.0",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["llvmlite", "llvmlite.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true